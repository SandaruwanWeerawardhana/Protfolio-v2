name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Lint
        run: npm run lint

      # No basePath/assetPrefix: the site is served from the apex custom domain
      # root, so assets must resolve at "/_next/...".
      - name: Build (static export)
        run: npm run build

      - name: Add Pages control files
        run: |
          touch out/.nojekyll
          echo 'sandaruwanweerawardhana.me' > out/CNAME

      - name: Verify export output
        run: |
          test -f out/index.html
          test -d out/_next/static
          ls out/_next/static/chunks/*.css >/dev/null
          # Fail loudly if a repository base path ever leaks back into the HTML.
          ! grep -q '"/Portfolio/' out/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
